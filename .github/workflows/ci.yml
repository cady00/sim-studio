name: CI

# Linux runs on pull requests only (not on every push) so a branch push and its
# PR do not bill the same minutes twice. Docs-only changes do not start a job.
# Windows packaging is manual: workflow_dispatch. Windows minutes count double
# on private repos, so do not put that job back on push or pull_request.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE.txt'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt, Open CASCADE, and Catch2
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config cmake \
            qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev libglu1-mesa-dev \
            libocct-foundation-dev libocct-modeling-data-dev libocct-modeling-algorithms-dev \
            libocct-data-exchange-dev libocct-ocaf-dev libocct-visualization-dev \
            nlohmann-json3-dev catch2 libtbb-dev libfontconfig1-dev \
            pybind11-dev python3-dev git
      - name: Configure
        run: cmake --preset linux-system
      - name: Build
        run: cmake --build --preset linux-system
      - name: Test
        run: ctest --preset linux-system --output-on-failure

  windows:
    name: Windows package
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    # First uncached run builds OCCT 8, Python 3, OpenSSL 3.6, Jolt, zlib, liblzma
    # and curl from the vcpkg baseline. Expect about 90–120 minutes. Later runs
    # restore the vcpkg binary cache and the Qt cache; expect about 20–30 minutes.
    # This job is workflow_dispatch only. Do not start it from a push.
    timeout-minutes: 180
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4
      - name: Install prebuilt Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          setup-python: false
      - name: Export GitHub Actions cache variables for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL ?? '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN ?? '');
      - name: Cache the vcpkg tool
        uses: actions/cache@v4
        with:
          path: C:\vcpkg
          key: vcpkg-tool-${{ hashFiles('vcpkg.json') }}
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path C:\vcpkg\vcpkg.exe)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          }
      - name: Configure
        shell: pwsh
        run: cmake --preset windows-msvc -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
      - name: Build
        run: cmake --build --preset windows-msvc-release
      - name: Test
        run: ctest --preset windows-msvc-release --output-on-failure
      - name: Package zip
        shell: pwsh
        run: powershell -File cmake/package_windows.ps1
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimStudio-win64
          path: dist/*
          if-no-files-found: error
