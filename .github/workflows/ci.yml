name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt, Open CASCADE, and Catch2
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config cmake \
            qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev libglu1-mesa-dev \
            libocct-foundation-dev libocct-modeling-data-dev libocct-modeling-algorithms-dev \
            libocct-data-exchange-dev libocct-ocaf-dev libocct-visualization-dev \
            nlohmann-json3-dev catch2 libtbb-dev libfontconfig1-dev \
            libbullet-dev pybind11-dev python3-dev
      - name: Configure
        run: cmake --preset linux-system
      - name: Build
        run: cmake --build --preset linux-system
      - name: Test
        run: ctest --preset linux-system --output-on-failure

  windows:
    name: Windows vcpkg
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4
      - name: Export GitHub Actions cache variables for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL ?? '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN ?? '');
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path C:\vcpkg\vcpkg.exe)) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          }
      - name: Configure
        run: cmake --preset windows-msvc
      - name: Build
        run: cmake --build --preset windows-msvc-release
      - name: Test
        run: ctest --preset windows-msvc-release --output-on-failure
      - name: Package zip
        shell: pwsh
        run: powershell -File cmake/package_windows.ps1
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimStudio-win64
          path: dist/*
          if-no-files-found: error
